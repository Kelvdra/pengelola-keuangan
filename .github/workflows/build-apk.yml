name: Build APK
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Copy offline libraries
        run: npm run libs
      - name: Create Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android --assetPath assets
          npx cap sync android
      - name: Set app version from tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then V="0.0.1"; fi
          IFS=. read MA MI PA <<< "$V"
          CODE=$((MA*10000+MI*100+PA))
          sed -i "s/versionCode [0-9]*/versionCode $CODE/; s/versionName \".*\"/versionName \"$V\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Pengelola-Keuangan-v${APP_VERSION}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pengelola-keuangan-apk
          path: Pengelola-Keuangan-v*.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Pengelola-Keuangan-v*.apk
