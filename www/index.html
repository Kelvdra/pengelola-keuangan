<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pengelola Keuangan</title>
<meta name="description" content="Catat pemasukan, pengeluaran, dan saldo dompet Anda secara offline.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0e17" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="css/app.css">
<script src="lib/xlsx.full.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <div class="mark" id="mark"></div>
      <div><h1>Pengelola Keuangan</h1><small id="sub"></small></div>
    </div>
    <div class="sel"><select id="mon" aria-label="Pilih periode"></select><span class="i-slot"></span></div>
  </header>

  <section class="hero" id="hero" aria-label="Ringkasan periode">
    <div class="lbl" id="hLbl"></div>
    <div class="bal num" id="hBal"></div>
    <div class="split">
      <div class="cell"><div class="dot" id="hInI"></div><div><span>Pemasukan</span><b class="num" id="hIn"></b></div></div>
      <div class="cell"><div class="dot" id="hOutI"></div><div><span>Pengeluaran</span><b class="num" id="hOut"></b></div></div>
    </div>
  </section>

  <main id="main"></main>

  <nav aria-label="Navigasi utama">
    <button data-t="h" class="on">Riwayat</button>
    <button data-t="w">Dompet</button>
    <button id="fab" aria-label="Tambah transaksi"></button>
    <button data-t="g">Grafik</button>
    <button data-t="d">Data</button>
  </nav>

  <div class="modal" id="mod" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="mh"><button id="cx" class="l">Batal</button><b id="mt">Transaksi baru</b><button id="del" class="r danger" style="visibility:hidden">Hapus</button></div>
    <div class="seg" id="seg"><button data-y="out" class="on">Pengeluaran</button><button data-y="in">Pemasukan</button><button data-y="tf">Transfer</button></div>
    <div class="mc"><div class="grid" id="cats"></div><p class="hint" id="tfh" style="display:none">Pilih dompet asal dan tujuan di bawah, lalu isi jumlah yang dipindahkan. Untuk transfer atau top up yang kena biaya admin, isi kolom Biaya admin (kosongkan jika gratis).</p></div>
    <div class="pad">
      <div class="wr"><div class="sel"><select id="a1" aria-label="Dompet"></select><span class="i-slot"></span></div><div class="sel"><select id="a2" aria-label="Dompet tujuan"></select><span class="i-slot"></span></div></div>
      <div class="amt"><em>Rp</em><input id="amt" type="text" inputmode="numeric" enterkeyhint="next" autocomplete="off" placeholder="0" aria-label="Jumlah"></div>
      <div class="nt fee" id="feew" style="display:none"><span>Biaya admin <small>(opsional)</small></span><em>Rp</em><input id="fee" type="text" inputmode="numeric" enterkeyhint="next" autocomplete="off" placeholder="Gratis" aria-label="Biaya admin, kosongkan jika gratis"></div>
      <div class="nt"><span>Catatan</span><input id="note" type="text" inputmode="text" enterkeyhint="done" autocomplete="off" placeholder="Tambahkan catatan..." maxlength="80"></div>
      <div id="chip"></div>
      <input id="dt" type="date" tabindex="-1" aria-hidden="true" style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px">
      <div class="foot"><button class="dt" id="dtb" type="button" aria-label="Pilih tanggal"></button><button class="btn ok" id="save" type="button"></button></div>
    </div>
  </div>

  <div class="modal" id="cm" style="z-index:20"></div>
  <div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script src="js/icons.js"></script>
<script src="js/xlsxwriter.js"></script>
<script src="js/report.js"></script>
<script src="js/app.js"></script>
</body>
</html>
